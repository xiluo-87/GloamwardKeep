<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gloamward Keep · 3D Renderer Benchmark</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.45 system-ui, sans-serif; background: #1c2a2b; color: #e9e4d2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
      main { position: relative; z-index: 2; width: min(430px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; margin: 12px; padding: 16px; border: 1px solid #738173; border-radius: 8px; background: #202a29ed; box-shadow: 0 8px 32px #0008; }
      h1 { margin: 0 0 4px; font-size: 20px; } p { margin: 0 0 12px; color: #c3c7b5; }
      fieldset { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; margin: 12px 0; padding: 10px; border: 1px solid #52665b; }
      legend { color: #dbc994; padding: 0 5px; } label { display: grid; gap: 3px; } label.check { display: flex; align-items: center; }
      input, select, button { min-width: 0; padding: 6px 8px; border: 1px solid #728071; border-radius: 4px; background: #273432; color: inherit; }
      button { cursor: pointer; background: #596b4d; font-weight: 650; } button:disabled { opacity: .55; cursor: wait; }
      nav { display: flex; gap: 8px; } nav button { flex: 1; }
      #status { min-height: 1.5em; color: #dbc994; margin: 10px 0; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 38vh; overflow: auto; padding: 10px; background: #111a19; border-radius: 4px; font: 11px/1.4 ui-monospace, monospace; }
      .hint { font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="benchmark-canvas" aria-label="3D renderer benchmark scene"></canvas>
    <main>
      <h1>3D Renderer Benchmark</h1>
      <p>Development stress fixture · rendering only · default camera SE / 35.3°</p>
      <fieldset>
        <legend>Fixture</legend>
        <label>Map<select id="map"><option value="meadow">Meadow</option><option value="highlands">Highlands</option><option value="canyon">Canyon</option></select></label>
        <label>Map seed<input id="seed" type="number" value="0" step="1"></label>
        <label>Camera direction<select id="direction"><option value="0">SE</option><option value="1">SW</option><option value="2">NW</option><option value="3">NE</option></select></label>
        <label>Camera tilt<select id="tilt"><option value="0">25°</option><option value="1" selected>35.3°</option><option value="2">45.0°</option><option value="3">55.0°</option></select></label>
        <label>Enemies (max 600)<input id="enemies" type="number" min="0" max="600" value="600"></label>
        <label>Projectiles (max 400)<input id="projectiles" type="number" min="0" max="400" value="400"></label>
        <label>Pets (max 160)<input id="pets" type="number" min="0" max="160" value="160"></label>
        <label>Burn pools (max 80)<input id="pools" type="number" min="0" max="80" value="80"></label>
        <label>Towers (max 80)<input id="towers" type="number" min="0" max="80" value="80"></label>
        <label class="check"><input id="goblins" type="checkbox"> All goblins (single-species stress)</label>
      </fieldset>
      <fieldset>
        <legend>Sample</legend>
        <label>Warmup seconds<input id="warmup" type="number" min="0" max="30" value="3"></label>
        <label>Sample seconds<input id="duration" type="number" min="10" max="180" value="10"></label>
        <label>Dispose/recreate cycles<input id="cycles" type="number" min="1" max="5" value="1"></label>
        <span class="hint">Minimum sample is 10 seconds after warmup.</span>
      </fieldset>
      <nav><button id="run">Run sample</button><button id="cancel" disabled>Cancel</button></nav>
      <div id="status" role="status">Ready.</div>
      <nav><button id="download-json" disabled>Download JSON</button><button id="download-csv" disabled>Download CSV</button></nav>
      <pre id="output">No sample collected.</pre>
    </main>
    <script type="module" src="./src/render3d/benchmark.ts"></script>
  </body>
</html>
